name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bsv-language-server/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install tree-sitter-cli
        run: cargo install tree-sitter-cli --version 0.24.7

      - name: Generate parser
        run: |
          cd tree-sitter-bsv
          tree-sitter generate

      - name: cargo fmt
        run: |
          cd bsv-language-server
          cargo fmt --check

      - name: cargo clippy
        run: |
          cd bsv-language-server
          cargo clippy -- -D warnings

      - name: cargo test
        run: |
          cd bsv-language-server
          cargo test